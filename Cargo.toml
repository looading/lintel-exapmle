[package]
name = "lintel-world-clock"
version = "0.1.0"
edition = "2024"

[dependencies]
lintel = { package = "lintel-framework", version = "=0.1.1" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
directories = "6"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sunrise = "3"
notify-rust = "4"
url = "2"

[package.metadata.lintel]
id = "dev.lintel.world-clock"
name = "世界时钟"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.15.3", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAppleEventDescriptor", "NSArray", "NSDate", "NSError", "NSString", "libc", "objc2-core-services"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["AE", "AEDataModel", "AEObjects", "AERegistry", "AppleEvents"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Registry", "Win32_System_Threading"] }
